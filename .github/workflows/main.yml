name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Quality pipeline (compileall, pytest, ruff safe)
        env:
          DRY_RUN: "true"
          LIVE_TRADING: "false"
        run: python scripts/quality_pipeline.py
