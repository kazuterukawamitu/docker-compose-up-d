repos:
  - repo: local
    hooks:
      - id: compileall
        name: compileall
        entry: python -m compileall -q src
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: env PYTHONPATH=src pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
